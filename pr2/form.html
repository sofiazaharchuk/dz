<!DOCTYPE html>
<html lang="uk"> 
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Sofiazah">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма реєстрації</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>
   <header class="hero">
        <h1>Зв'яжіться з нами</h1>
        <p>Надішліть нам повідомлення</p>
    </header>

    <main class="contact-form-section">
        <form action="#" method="post" class="contact-form">
            <label for="full-name">Повне ім'я:</label>
            <input type="text" id="full-name" name="full-name"  placeholder="Ваше ім'я" required>

            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" placeholder="Ваша електорона адреса" required>

            <label for="phone">Номер телефону:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="xxx-xxx-xxxx">

            <label for="topic">Виберіть тему:</label>
            <select id="topic" name="topic">
                <option value="general">Загальне питання</option>
                <option value="support">Технічна підтримка</option>
                <option value="feedback">Відгук</option>
            </select>

            <label for="message">Ваше повідомлення:</label>
            <textarea id="message" name="message" rows="5"  placeholder="Ваше повідомлення" required></textarea>

            <label for="attachment">Завантажити файл:</label>
            <input type="file" id="attachment" name="attachment">

            <label for="privacy-policy" class="privacy-label">
                <input type="checkbox" id="privacy-policy" name="privacy-policy" required>
                Я погоджуюсь з політикою конфіденційності
            </label>

            <div class="date-fields">
                <label for="start-date">Дата початку:</label>
                <input type="date" id="start-date" name="start-date">
                
                <label for="end-date">Дата завершення:</label>
                <input type="date" id="end-date" name="end-date">
            </div>

            <button type="submit">Відправити</button>
        </form>
    </main>
    
    <footer>
        <p>&copy; 2025. Всі права захищено.</p>
    </footer>
</body>
</html>
